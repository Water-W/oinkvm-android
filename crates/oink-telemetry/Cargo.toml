[package]
name = "oink-telemetry"
description = "Closed, opt-in crash and performance report boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"
tempfile = "3"
fs2 = "0.4"
tokio.workspace = true

# Android has no system OpenSSL for native-tls; it uses rustls with bundled roots.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "system-proxy"] }
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
oink-foundation.workspace = true

[lints]
workspace = true
